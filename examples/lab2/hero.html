<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Перший екран Sillage</title><link rel="stylesheet" href="sillage.css"></head><body>
        <section class="hero">
            <div class="hero-content">
                <h1>Discover the World<br>of Fragrance</h1>

                <p>
                    Explore perfumes, discover fragrance notes and share
                    your impressions with a community of scent lovers.
                </p>

                <form class="search-form" id="search" role="search">
                    <label for="perfume-search">Search fragrances</label>
                    <div class="search-box">
                        <input
                            type="search"
                            id="perfume-search"
                            name="query"
                            placeholder="Search perfumes, brands, notes..."
                        >
                        <button type="submit">Search</button>
                    </div>
                </form>
            </div>
            <img class="hero-image" src="images/toynew.jpg"
                 alt="Colourful Moschino perfume bottles shaped like teddy bears"
                 width="1650" height="2048">
        </section>
</body></html>
